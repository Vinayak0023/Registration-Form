<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Employee Registration Form</title>
    <link rel="stylesheet" href="Employee.css">
</head>

<body>
    <div class="wrap">
        <form>
            <h1>Employee Registration Form</h1>
            <label>Your name</label><input type="text">
            <label>Email address</label><input type="email">
            <label class="lbl">Gender</label>
            <label class="opt"><input type="checkbox">Male</label>
            <label class="opt"><input type="checkbox">Female</label>
            <label>Date of Birth</label><input type="date">
            <label class="lbl">Department</label>
            <label class="opt"><input type="checkbox">HR</label>
            <label class="opt"><input type="checkbox">HOD</label>
            <label class="opt"><input type="checkbox">Teacher</label>
            <label>Salary</label><input type="text">
            <label>Adress</label><textarea></textarea>
            <button class="reg" type="button">Submit</button>
        </form>
        <div class="side">
            <div class="img msg">Marwadi University</div>
            <div class="img i1">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSeJ_5uz5T-_olQeWETc_I9ff8x8B2GWJ90CQlmoOoXNghjyRdN"
                    alt="🏫">
            </div>
        </div>
    </div>
</body>

</html>
