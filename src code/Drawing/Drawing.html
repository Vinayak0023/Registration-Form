<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Drawing Registration Form</title>
    <link rel="stylesheet" href="Drawing.css">
</head>

<body>
    <div class="wrap">
        <form>
            <h1>Drawing Registration Form</h1>
            <label>Participant Name</label><input type="text">
            <label>Email ID</label><input type="email">
            <label>Age</label><input type="text">
            <label class="lbl">Gender</label>
            <label class="opt"><input type="checkbox">Male</label>
            <label class="opt"><input type="checkbox">Female</label>
            <label class="lbl">Drawing Category</label>
            <label class="opt"><input type="checkbox">Pencil</label>
            <label class="opt"><input type="checkbox">Painting</label>
            <label class="opt"><input type="checkbox">Other</label>
            <div class="decl">Declaration<br>Checkbox: I confirm that the information provided is correct.<br>Checkbox:
                I agree to follow all competition rules and regulations.</div>
            <label class="opt agree"><input type="checkbox">yes,i agree</label>
            <button class="reg" type="button">Submit</button>
        </form>
        <div class="side">
            <div class="img i1">
                <img src="https://img-c.udemycdn.com/course/480x270/2022460_8546.jpg" alt="">
            </div>
            <div class="img i2">
                <img src="https://encrypted-tbn2.gstatic.com/images?q=tbn:ANd9GcTwDvnLPgwgdq56E6JLOxjYLcmJHlq_v4y10bht7pSv31R9-4RI"
                    alt="">
            </div>
            <div class="img i3">
                <img src="https://encrypted-tbn1.gstatic.com/images?q=tbn:ANd9GcSnrjvCQuban3x6JxTPVz5nlnfnH37Au7JnQo1BrfNoGufQjVTK"
                    alt="">
            </div>
            <button class="sub" type="button">Register →</button>
        </div>
    </div>
</body>

</html>
