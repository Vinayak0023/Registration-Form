<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Kabaddi Registration Form</title>
    <link rel="stylesheet" href="Kabaddi.css">
</head>

<body>
    <div class="wrap">
        <form>
            <h1>Kabaddi Registration Form</h1>
            <label>Student name</label><input type="text">
            <label>Enter your email</label><input type="email">
            <label class="lbl">Tournament Participated</label>
            <label class="opt"><input type="checkbox">Yes</label>
            <label class="opt"><input type="checkbox">No</label>
            <label>Name Tournament Details</label><textarea></textarea>
            <label class="lbl">Student Specilization</label>
            <label class="opt"><input type="checkbox">Raider</label>
            <label class="opt"><input type="checkbox">Defender</label>
            <label class="opt"><input type="checkbox">All-Rounder</label>
            <label>Playing Experience</label><input type="text">
            <label>Team No. of Participants (if available)</label><input type="text">
            <button class="reg" type="button">Submit my answers</button>
        </form>
        <div class="side">
            <div class="img i1">
                <img src="https://encrypted-tbn2.gstatic.com/images?q=tbn:ANd9GcQ3d9hpKszJgmKGd3KEmZ1K9H2mQgzjytnEIJb0hAPL1tvGX426"
                    alt="🤼">
            </div>
            <div class="row">
                <div class="img i2">
                    <img src="https://encrypted-tbn2.gstatic.com/images?q=tbn:ANd9GcTI-_Inv7gYV4iaf0oDRO-_BlsAgYupIULVRO85tuMjDcITQsMx"
                        alt="🏃">
                </div>
                <div class="img i3">Join Now ↖</div>
            </div>
        </div>
    </div>
</body>

</html>
