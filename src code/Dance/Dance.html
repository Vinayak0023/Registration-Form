<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Dance Registration Form</title>
    <link rel="stylesheet" href="Dance.css">
</head>

<body>
    <div class="wrap">
        <form>
            <h1>Dance Registration Form</h1>
            <label>Name</label><input type="text">
            <label>Enter your email*</label><input type="email">
            <label>Age</label><input type="text">
            <label>Dance Type</label><input type="text">
            <label>Mobile Number</label><input type="text">
            <label class="lbl">Dance Category :</label>
            <input class="opt" type="checkbox">Hip-Hop</input>
            <br><br>
            <input class="opt" type="checkbox">Classical</input>
            <br><br>

            <input class="opt" type="checkbox">Folk</input>
            <br><br>

            <input class="opt" type="checkbox">Other</input>

            <div class="decl">Declaration<br>Checkbox: I confirm that the information provided is correct.<br>Checkbox:
                I agree to follow all competition rules and regulations.</div>
            <div class="agree"><input type="checkbox" id="a"><label for="a" style="margin:0">Yes,I agree</label></div>
            <button class="reg" type="button">Register</button>
        </form>

                    alt="">

            </div>
            <button class="sub">Submit</button>
        </div>
    </div>
