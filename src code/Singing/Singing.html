<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Singing Competition Form</title>
    <link rel="stylesheet" href="Singing.css">
</head>

<body>
    <div class="wrap">
        <form>
            <h1>Singing Competition Form</h1>
            <label>Your name</label><input type="text">
            <label>Age</label><input type="text">
            <label>Enter your email</label><input type="email">
            <label>Nominate a song for our playlist!</label><input type="text">
            <label class="lbl">Participated in competition</label>
            <label class="opt"><input type="checkbox">Yes</label>
            <label class="opt"><input type="checkbox">No</label>
            <label class="lbl">Gender</label>
            <label class="opt"><input type="checkbox">Male</label>
            <label class="opt"><input type="checkbox">Female</label>
            <label>Song Languauge</label><input type="text">
            <button class="reg" type="button">Submit</button>
        </form>
        <div class="side">
            <div class="row">
                <div class="img i1">
                    <img src="https://encrypted-tbn1.gstatic.com/images?q=tbn:ANd9GcSbOA7EqjLk8ttYkLoJkSXe1eUK5f2-B61mjZ3KeGpZhFLGlq0I"
                        alt="🎤">
                </div>
                <div class="img i2">
                    <img src="https://m.media-amazon.com/images/I/71Yxc34Rf9L._AC_UF350,350_QL50_.jpg" alt="🏆">
                </div>
            </div>
            <div class="row">
                <div class="img i3">
                    <img src="https://encrypted-tbn1.gstatic.com/images?q=tbn:ANd9GcTnMRDZE-hmcdQUU9q-1Zdbgr3x2kWrIzG9VXeSSTC_QWjdFiRg"
                        alt="🎙️">
                </div>
                <div class="img i4">
                    <img src="https://encrypted-tbn1.gstatic.com/images?q=tbn:ANd9GcQxWvtD5eAVVJH2d8Z_xmFVu4Uw_isPND78in109k1hWwHQnMPV"
                        alt="🎶">
                </div>
            </div>
            <button class="sub" type="button">Register Now</button>
        </div>
    </div>
</body>

</html>
