<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Quiz Competition Registration Form</title>
    <link rel="stylesheet" href="Quiz.css">
</head>

<body>
    <div class="wrap">
        <form>
            <h1>Quiz Competition Registration Form</h1>
            <label>Your Name</label><input type="text">
            <label>Enroll NO.</label><input type="text">
            <label>Date of Birth</label><input type="date">
            <label>Email ID</label><input type="email">
            <label>School / College Name</label><input type="text">
            <label>Course</label><input type="text">
            <label class="lbl">Quiz Topic</label>
            <label class="opt">
                <input type="checkbox">General Knowledge</label>
            <label class="opt">
                <input type="checkbox">Science</label>
            <label class="opt"><input type="checkbox">Sports</label>
            <label>Participants No.</label><input type="text">
            <button class="reg" type="button">Submit</button>
        </form>
        <div class="side">
            <div class="img i1">
                <img src="https://encrypted-tbn3.gstatic.com/images?q=tbn:ANd9GcS0f3p1XV97ZCVcwuRiEbcVn54maMIuSohiyayJVXYLuJ4pqG9t"
                    alt="QUIZ">
            </div>
            <div class="img i2">
                <img class="yo"
                    src="https://img.magnific.com/free-vector/quiz-background-with-items-flat-design_23-2147599082.jpg?semt=ais_hybrid&w=740&q=80"
                    alt="📝">
            </div>
        </div>
    </div>
</body>

</html>
