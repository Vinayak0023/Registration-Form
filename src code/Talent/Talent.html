            <label class="opt"><input type="checkbox">Male</label>
            <label class="opt"><input type="checkbox">Female</label>
            <label class="lbl">Talent Type</label>
            <label class="opt"><input type="checkbox">Singing</label>
            <label class="opt"><input type="checkbox">Dancing</label>
            <label class="opt"><input type="checkbox">Acting</label>
            <label class="opt"><input type="checkbox">Comedy</label>
            <label class="opt"><input type="checkbox">Other</label>
            <label>Got a question for our speakers? Share it here!</label><textarea></textarea>
            <label class="lbl">Participation Type</label>
            <label class="opt"><input type="checkbox">Solo</label>
            <label class="opt"><input type="checkbox">Group</label>
            <label>Group Name</label><input type="text">
            <label class="lbl">Background Track Required</label>
            <label class="opt"><input type="checkbox">yes</label>
            <label class="opt"><input type="checkbox">no</label>
            <label>Talent Show / Event Name</label><input type="text">
            <div class="decl">Declaration<br>Checkbox: I confirm that the information provided is correct.<br>Checkbox:
                I agree to follow all event rules and regulations.</div>
            <label class="opt agree"><input type="checkbox">Yes, I agree</label>
            <button class="reg" type="button">Submit</button>
        </form>

            <div class="img i3">
