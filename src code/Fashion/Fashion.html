<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Fashion Show Registration Form</title>
    <link rel="stylesheet" href="Fashion.css">
</head>

<body>
    <div class="top">
        <div class="badge">Fashion<br>Talent</div>
        <span>
            <img class="aja"
                src="https://encrypted-tbn3.gstatic.com/images?q=tbn:ANd9GcTFie2OMjiqVii36_lYSdlp4DMSbe2YpbKCbnDVRwtp2hbfx5_9"
                alt="">
        </span>
        <span>
            <img class="aja"
                src="https://encrypted-tbn3.gstatic.com/images?q=tbn:ANd9GcR_5oCgk2PlZoMfOP4CMTdA_CVEqhCz5WDBiZWEe_k4cFNFs2mm"
                alt="">
        </span>
        <span>
            <img class="aja"
                src="https://encrypted-tbn3.gstatic.com/images?q=tbn:ANd9GcR5L6qZmFH5oFye1wMMuGKxJ1UOFOhJzo3qD30apv5BBkDtG4eY"
                alt="👗">
        </span>

    </div>
    <div class="wrap">
        <form>
            <h1>Fashion Show Registration Form</h1>
            <label>Your name</label><input type="text">
            <label>Age</label><input type="text">
            <label class="lbl">Choice of entrée</label>
            <label class="opt"><input type="checkbox">Meat</label>
            <label class="opt"><input type="checkbox">Seafood</label>
            <label class="opt"><input type="checkbox">Vegetarian</label>
            <label class="lbl">Gender</label>
            <label class="opt"><input type="checkbox">Male</label>
            <label class="opt"><input type="checkbox">Female</label>
            <label>Email ID</label><input type="email">
            <label class="lbl">Participation Type</label>
            <label class="opt"><input type="checkbox">Solo</label>
            <label class="opt"><input type="checkbox">Group</label>
            <label class="lbl">Fashion Theme</label>
            <label class="opt"><input type="checkbox">Traditional</label>
            <label class="opt"><input type="checkbox">Western</label>
            <label class="opt"><input type="checkbox">Casual</label>
            <label class="opt"><input type="checkbox">Formal</label>
            <label>Group Name</label><input type="text">
            <label>Number of Members</label><input type="text">
            <label>Participant Signature</label><input type="text">
            <label>Date</label><input type="date">
            <div class="decl">Declaration<br>Checkbox: I confirm that the information provided is correct.<br>Checkbox:
                I agree to follow all event rules and regulations.</div>
            <label class="opt agree"><input type="checkbox">Yes, I agree</label>
            <button class="reg" type="button">Enroll Now</button>
        </form>
    </div>
</body>

</html>
