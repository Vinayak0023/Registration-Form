<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Photography Competition Registration Form</title>
    <link rel="stylesheet" href="Photography.css">
</head>

<body>
    <div class="wrap">
        <form>
            <h1>Photography Competition Registration Form</h1>
            <label>Student name</label><input type="text">
            <label>Age</label><input type="text">
            <label class="lbl">Check your understanding! Which is correct?</label>
            <label class="opt"><input type="checkbox">Option 1</label>
            <label class="opt"><input type="checkbox">Option 2</label>
            <label class="opt"><input type="checkbox">Option 3</label>
            <label>What is your main takeaway?</label><textarea></textarea>
            <label class="lbl">Gender</label>
            <label class="opt"><input type="checkbox">male</label>
            <label class="opt"><input type="checkbox">female</label>
            <label>Email ID</label><input type="email">
            <label class="lbl">Photography Category</label>
            <label class="opt"><input type="checkbox">Nature</label>
            <label class="opt"><input type="checkbox">Wildlife</label>
            <label class="opt"><input type="checkbox">Portrait</label>
            <label class="opt"><input type="checkbox">other</label>
            <div class="decl">Declaration<br>Checkbox: I confirm that the information provided is correct.<br>Checkbox:
                I agree to follow all competition rules and regulations.</div>
            <label class="opt agree"><input type="checkbox">I agree</label>
            <button class="reg" type="button">Submit</button>
        </form>
        <div class="side">
            <div class="img i1">
                <img class="yaha"
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ4qJ4sbCAfhIZKZFd7atd6c-dF6vFuD6JEGr_fx_iQVoV93bWV"
                    alt="📷">
            </div>
            <div class="img i2">
                <img class="yaha"
                    src="https://encrypted-tbn2.gstatic.com/images?q=tbn:ANd9GcQiBiLu8xmU7KRHgQBNQnX3S8rqsKjunlKc9ejYoDBKNu_4ziPX"
                    alt="🌄">
            </div>
            <button class="sub" type="button">Register Now</button>
        </div>
    </div>
</body>

</html>
